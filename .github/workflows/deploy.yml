name: Deploy React App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'  # ✅ Stable version

    - name: Clean install dependencies
      run: npm ci

    - name: Set environment variables
      run: |
        echo VITE_API_KEY=${{ secrets.VITE_API_KEY }} >> .env
        echo VITE_API_URL=${{ secrets.VITE_API_URL }} >> .env

    - name: Debug - Check .env file
      run: cat .env

    - name: Build the React app
      run: npm run build

    - name: Debug - Verify dist folder
      run: ls -la ./dist  # ✅ Ensures `dist` exists before upload

    - name: Setup Pages
      uses: actions/configure-pages@v3

    - name: Upload artifact (GitHub Pages)
      uses: actions/upload-artifact@v4  # ✅ Fixed Upload
      with:
        name: github-pages
        path: ./dist
        retention-days: 1
        compression-level: 6
        if-no-files-found: error

    - name: Debug - Check uploaded artifacts
      run: ls -la /home/runner/work/_temp/  # ✅ Confirms artifact exists

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2
      with:
        artifact_name: github-pages  # ✅ Matches uploaded artifact name
