name: Deploy React App

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'  # ✅ More stable version

    - name: Clean install dependencies
      run: npm ci  # ✅ Ensures a clean dependency install

    - name: Set environment variables
      run: |
        echo VITE_API_KEY=${{ secrets.VITE_API_KEY }} >> .env
        echo VITE_API_URL=${{ secrets.VITE_API_URL }} >> .env

    - name: Debug - Check .env file
      run: cat .env  # ✅ Check if secrets are correctly set

    - name: Build the React app
      run: npm run build

    - name: Debug - Check build output
      run: ls -la ./dist  # ✅ Ensures `dist` exists

    - name: Fix permissions
      run: chmod -R 755 ./dist  # ✅ Prevents permission errors

    - name: Setup Pages
      uses: actions/configure-pages@v3

    - name: Upload artifact (GitHub Pages)
      uses: actions/upload-pages-artifact@v3.0.1  # ✅ Explicit version
      with:
        path: "./dist"
        name: "github-pages"  # ✅ Ensure correct artifact name

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2
      with:
        artifact_name: "github-pages"  # ✅ Ensure it matches upload name
